<script>
const I18N = {
  'nav-about':        { ja:'about',            en:'About' },
  'nav-cats':         { ja:'里親募集',          en:'Cats' },
  'nav-duo':          { ja:'メンバー',          en:'Team' },
  'nav-donate':       { ja:'寄付',              en:'Donate' },
  'nav-foster':       { ja:'応募方法',          en:'How to Adopt' },
  'mnav-about':       { ja:'about',            en:'About' },
  'mnav-cats':        { ja:'里親募集',          en:'Cats' },
  'mnav-duo':         { ja:'メンバー',          en:'Team' },
  'mnav-donate':      { ja:'寄付',              en:'Donate' },
  'mnav-foster':      { ja:'応募方法',          en:'How to Adopt' },
  'page-h1':          { ja:'里親募集中の子たち', en:'Cats Looking for Homes' },
  'page-p':           { ja:'現在リネコがお世話をしている猫たちと、卒業していった猫たちの一覧です。', en:'Here are the cats currently in our care, and the ones who&rsquo;ve already found their forever homes.' },
  'back-link':        { ja:'← トップページに戻る', en:'&larr; Back to Home' },
  'adopt-h2':         { ja:'里親募集中の子たち', en:'Cats Looking for Homes' },
  'adopted-h2':       { ja:'卒業していった子たち', en:'Happily Adopted' },
  'footer-link-donate': { ja:'寄付する', en:'Donate' },
  'footer-link-foster': { ja:'応募方法', en:'How to Adopt' },
  'bar-btn-foster':   { ja:'<svg class="icon" viewBox="0 0 24 24"><use href="#icon-house"></use></svg> 里親になりたい', en:'<svg class="icon" viewBox="0 0 24 24"><use href="#icon-house"></use></svg> Become a Foster' },
  'bar-btn-donate':   { ja:'<svg class="icon" viewBox="0 0 24 24"><use href="#icon-heart"></use></svg> 寄付する', en:'<svg class="icon" viewBox="0 0 24 24"><use href="#icon-heart"></use></svg> Donate' },
};

let currentLang = 'ja';

function setLang(lang){
  currentLang = lang;
  document.documentElement.lang = lang;
  for(const id in I18N){
    const el = document.getElementById(id);
    if(el) el.innerHTML = I18N[id][lang];
  }
  document.getElementById('lang-ja').classList.toggle('active', lang === 'ja');
  document.getElementById('lang-en').classList.toggle('active', lang === 'en');
  try{ localStorage.setItem('reneko-lang', lang); }catch(e){}
  renderCats();
}

let allCats = [];

function catCardHtml(cat){
  const name = currentLang === 'en' ? (cat.name_en || cat.name_ja || '') : (cat.name_ja || cat.name_en || '');
  const note = currentLang === 'en' ? (cat.note_en || cat.note_ja || '') : (cat.note_ja || cat.note_en || '');
  const cls = cat.status === 'adopted' ? 'cat-card adopted' : 'cat-card';
  return `<div class="${cls}">
    <div class="cat-photo"><img src="${escapeHtml(cat.photo || '')}" alt="${escapeHtml(name)}" loading="lazy"></div>
    <div class="cat-body">
      <h3>${escapeHtml(name)}</h3>
      <p>${escapeHtml(note)}</p>
    </div>
  </div>`;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function renderCats(){
  const adoptGrid = document.getElementById('adopt-grid');
  const adoptedGrid = document.getElementById('adopted-grid');
  const adoptCats = allCats.filter(c => c.status !== 'adopted');
  const adoptedCats = allCats.filter(c => c.status === 'adopted');

  const emptyAdopt = currentLang === 'en' ? 'No cats are listed yet. Please check back soon!' : '現在募集中の猫はいません。またチェックしてみてください。';
  const emptyAdopted = currentLang === 'en' ? 'No adopted cats listed yet.' : '卒業していった子はまだ登録されていません。';

  adoptGrid.innerHTML = adoptCats.length
    ? adoptCats.map(catCardHtml).join('')
    : `<div class="empty-note" style="grid-column:1/-1;">${emptyAdopt}</div>`;

  adoptedGrid.innerHTML = adoptedCats.length
    ? adoptedCats.map(catCardHtml).join('')
    : `<div class="empty-note" style="grid-column:1/-1;">${emptyAdopted}</div>`;
}

// Google Sheets CSV export URL (set once the sheet is shared). Falls back to cats.json when empty.
const SHEET_CSV_URL = '';

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i + 1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      }else field += c;
    }else{
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && text[i + 1] === '\n') i++;
        row.push(field); field = '';
        rows.push(row); row = [];
      }else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return [];
  const headers = rows[0].map(h => h.trim());
  return rows.slice(1).filter(r => r.some(v => v.trim() !== '')).map(r => {
    const obj = {};
    headers.forEach((h, i) => { obj[h] = (r[i] || '').trim(); });
    return obj;
  });
}

async function loadCats(){
  try{
    if(SHEET_CSV_URL){
      const res = await fetch(SHEET_CSV_URL + (SHEET_CSV_URL.includes('?') ? '&' : '?') + '_=' + Date.now());
      const text = await res.text();
      allCats = parseCSV(text);
    }else{
      const res = await fetch('cats.json?_=' + Date.now());
      allCats = await res.json();
    }
  }catch(e){
    allCats = [];
  }
  renderCats();
}

function openMenu(){
  document.getElementById('mobile-menu').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeMenu(){
  document.getElementById('mobile-menu').classList.remove('open');
  document.body.style.overflow = '';
}

(function(){
  let lang = 'ja';
  try{ lang = localStorage.getItem('reneko-lang') || 'ja'; }catch(e){}
  currentLang = lang;
  setLang(lang);
  loadCats();
})();
</script>
